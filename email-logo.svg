    </g>
    <path d="M118 58 L118 124 Q118 142 100 142 Q84 142 82 128" stroke="#F5F0E6" fill="none" stroke-width="16" stroke-linecap="round"/>
    <path d="M138 66 L138 122 Q138 150 106 152" stroke="#F5F0E6" fill="none" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <text x="212" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="118" font-weight="800" letter-spacing="-2" fill="#F5F0E6">Juvra</text>
  </g>
